<nav class="site-nav">
  <a href="/" class="wordmark">{{ .Site.Title }}</a>
  <div class="navlinks">
    {{ range .Site.Menus.main }}
      {{ $isCurrent := or ($.IsMenuCurrent "main" .) (and $.IsHome (eq .URL "/")) }}
      <a href="{{ .URL }}" class="{{ if $isCurrent }}current{{ end }}"{{ if hasPrefix .URL "http" }} target="_blank" rel="noopener"{{ end }}>{{ .Name }}</a>
    {{ end }}
  </div>
</nav>
